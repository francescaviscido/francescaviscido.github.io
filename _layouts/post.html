---
layout: default
---
<article class="post-layout">
  <section class="post-hero">
    <div class="container post-hero-grid">
      <div>
        <a class="eyebrow-link" href="{{ '/blog/' | relative_url }}">← Torna al blog</a>
        <span class="eyebrow">{{ page.category }}</span>
        <h1>{{ page.title }}</h1>
        <p class="post-lead">{{ page.description }}</p>
        <div class="post-meta-line">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>
          {% if page.reading_time %}<span>{{ page.reading_time }}</span>{% endif %}
        </div>
      </div>
      {% if page.image %}
      <div class="post-hero-image">
        <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
      </div>
      {% endif %}
    </div>
  </section>
  <section class="section post-content-wrap">
    <div class="container post-content">
      {{ content }}
    </div>
  </section>
</article>
